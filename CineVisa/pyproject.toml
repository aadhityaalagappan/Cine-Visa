[project]
name = "cinevisa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aadhityaalagappan", email = "alagappan.aa@northeastern.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.26.1",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
cinevisa = "cinevisa:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
